name: test

# GitHub Actions on the repository owner account is currently blocked by a
# GitHub billing lock. Keep the workflow manual so PRs remain reviewable; once
# the account is unlocked, restore push/pull_request triggers if desired.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/scheiber_can_analyze.py data/examples/selected_frames.log --config config/system_config.json --output /tmp/scheiber-analysis
